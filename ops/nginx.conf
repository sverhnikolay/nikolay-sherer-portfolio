server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/nikolay-portfolio/current;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sherer-dev.ru$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/sherer-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherer-dev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PortfolioTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://sherer-dev.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sherer-dev.ru;

    ssl_certificate /etc/letsencrypt/live/sherer-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherer-dev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sherer-dev.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sherer-dev.ru;

    ssl_certificate /etc/letsencrypt/live/sherer-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherer-dev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PortfolioTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/nikolay-portfolio/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 12m;

    location = /admin { return 302 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ^~ /media/ {
        alias /var/lib/portfolio-cms/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    location = /index.html {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    location = /offer.html { proxy_pass http://127.0.0.1:8787; }
    location = /privacy.html { proxy_pass http://127.0.0.1:8787; }
    location / { try_files $uri $uri/ =404; }
    location ~ ^/(cms|ops|scripts|tests)/ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
