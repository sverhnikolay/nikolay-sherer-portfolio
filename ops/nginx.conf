server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/nikolay-portfolio/current;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sherer-dev.ru$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 72.56.240.148;

    ssl_certificate /etc/letsencrypt/live/72.56.240.148/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72.56.240.148/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PortfolioTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://sherer-dev.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sherer-dev.ru;

    ssl_certificate /etc/letsencrypt/live/sherer-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherer-dev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sherer-dev.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sherer-dev.ru;

    ssl_certificate /etc/letsencrypt/live/sherer-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherer-dev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PortfolioTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/nikolay-portfolio/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }
    location ~ ^/(ops|scripts|tests)/ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
