server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sherer-dev.ru www.sherer-dev.ru _;

    root /var/www/nikolay-portfolio/current;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(ops|scripts|tests)/ { return 404; }
    location ~ /\. { deny all; }
}
